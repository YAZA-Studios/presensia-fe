name: Deploy FE (Cloudflare Pages)

# Deploy otomatis ke produksi setiap push ke main — hanya setelah build lolos.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (typecheck + bundle, API produksi)
        run: npm run build
        env:
          VITE_API_URL: https://presensia-api.yazaprojectstudios.workers.dev/api

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name presensia-fe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
